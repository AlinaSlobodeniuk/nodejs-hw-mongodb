tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login user with payload
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: User's email
            type: string
            example: john.doe@mail.com
          password:
            description: User's password
            type: string
            example: user's pxxxxxxxxword
responses:
  '200':
    $ref: ../../components/responces/auth/200auth.yaml
  '401':
    $ref: ../../components/responces/auth/401auth.yaml