tags:
  - Auth
summary: Register user
operationId: registerUser
description: Register user with payload
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: User's name
            type: string
            example: John Doe
          email:
            description: User's email
            type: string
            example: john.doe@mail.com
          password:
            description: User's password
            type: string
            example: user's pxxxxxxxxword

responses:
  '201':
    $ref: ../../components/responces/auth/201.yaml
  '409':
    $ref: ../../components/responces/auth/409auth.yaml