tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update a contact by Id'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Contact Id
    schema:
      type: string
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380673438364'
          email:
            description: "Contact's email"
            type: string
            example: 'john.doe@example.com'
          isFavourite:
            description: 'Conctact belongs to favourites'
            type: boolean
            example: true
          contactType:
            description: 'Contact type'
            type: string
            example: 'work'
            enum: ['work', 'home', 'personal']
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    description: Invalid request payload
    $ref: ../../../components/responces/contacts/400.yaml

  '401':
    description: 'Unauthorized!'
    $ref: ../../../components/responces/contacts/401.yaml
  '404':
    description: 'Contact not found!'
    $ref: ../../../components/responces/contacts/404.yaml