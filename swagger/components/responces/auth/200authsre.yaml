description: Confirms the successful email sending to reset password!
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Reset password email was successfully sent.
        data:
          type: string
          example: null