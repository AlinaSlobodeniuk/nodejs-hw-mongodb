type: object
required:
  - name
  - email
  - password
properties:
  name:
    type: string
    description: The name of the user.
    example: 'John Doe'
  email:
    type: string
    format: email
    description: The email address of the user. It must be unique.
    example: 'john.doe@example.com'
  password:
    type: string
    description: The user's password. This field is required for creating a user, but it's not returned in the API response.
  _id:
    type: string
    description: The unique identifier of the user, generated by MongoDB.
    example: '60c72b2f9b1e8b001c8e1a1b'
  createdAt:
    type: string
    format: date-time
    description: The timestamp when the user was created.
  updatedAt:
    type: string
    format: date-time
    description: The timestamp when the user was last updated.